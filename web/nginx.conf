    # -- /rx65n/ : rx65n-web-writer page + relay (see web/README.md)
    # Goes inside the HTTPS server block. server.py listens on 127.0.0.1:5310
    # only while a session exists (w32ctl new starts it).
    location = /rx65n { return 301 https://$host/rx65n/; }
    location /rx65n/ {
        proxy_pass http://127.0.0.1:5310;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        access_log off;
    }
